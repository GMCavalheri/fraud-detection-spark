services:
  spark-master:
    image: bitnamilegacy/spark:3.5.6
    mem_limit: 512m
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8080:8080"   # Spark master web UI
      - "7077:7077"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  spark-worker-1:
    image: bitnamilegacy/spark:3.5.6
    mem_limit: 1.5g
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8081:8081"
    volumes:
      - ./data:/opt/data:ro   # raw source files only - executors just read these

  spark-worker-2:
    image: bitnamilegacy/spark:3.5.6
    mem_limit: 1.5g
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8082:8081"
    volumes:
      - ./data:/opt/data:ro

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates the bucket Spark/API read and write from, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${MINIO_BUCKET:-fraud-detection} &&
      echo 'bucket ready'
      "

  # One-shot batch job, not a long-running service. Run explicitly with:
  #   docker compose run --rm spark-pipeline
  spark-pipeline:
    build: ./spark_jobs
    mem_limit: 1.5g
    profiles: ["pipeline"]
    depends_on:
      spark-master:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - RAW_DATA_DIR=/opt/data/raw
      - PROCESSED_DATA_DIR=/opt/data/processed
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-fraud-detection}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-fraud_detection}
      - POSTGRES_USER=${POSTGRES_USER:-fraud_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - LOG_DIR=/opt/logs
    volumes:
      - ./data:/opt/data   # raw (read) + local JSON reports (written directly, not via Spark)
      - ./logs/spark_jobs:/opt/logs

  postgres:
    image: postgres:16
    mem_limit: 512m
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fraud_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-fraud_detection}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud_admin} -d ${POSTGRES_DB:-fraud_detection}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-fraud_detection}
      - POSTGRES_USER=${POSTGRES_USER:-fraud_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-fraud-detection}
      - PROCESSED_DATA_DIR=/opt/data/processed
    volumes:
      - ./data/processed:/opt/data/processed:ro   # metrics.json / data_quality_report.json only
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    mem_limit: 512m
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000
    ports:
      - "8501:8501"

volumes:
  postgres_data:
  minio_data:
